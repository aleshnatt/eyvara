[package]
name = "eyvara-vrf"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Naufal Ziyaadaturrahman <naufal@aleshnatt.com>"]
description = "Post-quantum lattice-based Verifiable Random Function (VRF) from Module-LWE, accompanying the Eyvara research paper"
documentation = "https://docs.rs/eyvara-vrf"
homepage = "https://github.com/aleshnatt/eyvara"
repository = "https://github.com/aleshnatt/eyvara"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["cryptography", "post-quantum", "vrf", "lattice", "mlwe"]
categories = ["cryptography"]
exclude = ["paper/", ".github/", "audit/", ".DS_Store"]

[lib]
name = "eyvara"
path = "src/lib.rs"

[dependencies]
sha3 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.6"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = { version = "0.8", features = ["std"] }
rand_chacha = "0.3"

[features]
default = []
serde = ["dep:serde"]

[[bench]]
name = "bench"
harness = false
