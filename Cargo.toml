[package]
name = "eyvara_vrf"
version = "0.1.0"
edition = "2021"
authors = ["Eyvara Research Team"]
description = "A lattice-based Verifiable Random Function from Module-LWE with tight uniqueness in the QROM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eyvara-vrf/eyvara"
keywords = ["vrf", "lattice", "post-quantum", "cryptography", "mlwe"]
categories = ["cryptography"]

[dependencies]
sha3 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false
